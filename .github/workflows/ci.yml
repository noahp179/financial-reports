name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: black --check .
      - run: mypy src
      - run: pytest -q --cov=src --cov-report=xml --cov-fail-under=85
      - run: pip-audit
