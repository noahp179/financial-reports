[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-reports"
version = "0.1.0"
description = "Deterministic financial report generator with DCF valuation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "pyyaml>=6",
  "jinja2>=3.1",
  "httpx>=0.27",
  "tenacity>=8",
  "python-dateutil>=2.9",
  "structlog>=24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.5",
  "black>=24",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
financial-report = "financial_reports.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"


[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
